<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="../css_file/home.css" />
</head>
<body class="page">

  <!-- NAV -->
  <nav>
    <div class="nav-logo">
      <img src="../Image_files/black efrei logo.png" alt="EFREI" style="margin-left: 40px;" />
    </div>
    <ul class="nav-links">
      <li><a href="home.html" class="active">Home</a></li>

      <li><a href="about.html">About</a></li>

    <div class="nav-search">
      <input type="text" placeholder="Search…" />

        <button class="carousel-btn prev" onclick="slide(-1)">&#8249;</button>
        <button class="carousel-btn next" onclick="slide(1)">&#8250;</button>

    <!-- Who we are -->
     
    <section class="who-section">
      <h2 class="section-title">Who we are</h2>
      <div class="who-grid">
        <div class="home-card">
          <span class="card-label">About us</span>
        </div>
        <div class="home-card">
          <span class="card-label">Our mission</span>
        </div>
        <div class="home-card">
          <span class="card-label">Our values</span>
        </div>
      </div>
    </section>

  </main>

  <footer>
    <img src="../Image_files/black efrei logo.png" alt="EFREI" onerror="this.style.display='none'" />
    <div class="footer-col">

      <p>+33 188 289 001</p>

    </div>
    <div class="footer-col">
      <h4>Campus Bordeaux:</h4>
      <p>+33 582 060 162</p>
